# Conventional commit message + local lint/typecheck via turbo.
repos:
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict]
  - repo: local
    hooks:
      - id: lint
        name: turbo lint
        entry: npm run lint
        language: system
        pass_filenames: false
      - id: typecheck
        name: turbo typecheck
        entry: npm run typecheck
        language: system
        pass_filenames: false
        stages: [pre-push]
